<!DOCTYPE html> 
<html class="dark" lang="ko">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Lumina Review - Review Analysis</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Geist:wght@400;600;700&amp;display=swap" rel="stylesheet">
        
        <!-- 추가 내용 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- ---- -->

        <!-- CSS -->
        <style>
            body {
                background-color: #00161f;
                color: #cae7f7;
                overflow-x: hidden;
            }

            .glass-panel {
                background: rgba(4, 35, 46, 0.6);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .hero-gradient {
                background: radial-gradient(circle at center, rgba(26, 95, 122, 0.15) 0%, transparent 70%);
            }
            
            /* 추가 내용 */
            /* 다크 테마 커스텀 SweetAlert2 팝업 디자인 클래스 정의 */
            .swal2-popup {
                background: #04232e !important; 
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                color: #cae7f7 !important; 
                border-radius: 12px !important;
            }
            .swal2-title { color: #ffffff !important; 
                font-family: "Geist", sans-serif; 
            }
            .swal2-confirm { 
                background-color: #1a5f7a !important; 
                color: #9bd7f7 !important; 
            }
            /* ---- */
        </style>
        <script id="tailwind-config">
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            "surface": "#00161f", "primary": "#92cfee", "primary-container": "#1a5f7a",
                            "on-primary-container": "#9bd7f7", "secondary": "#6fd8c8", "outline": "#8a9297", "on-surface-variant": "#c0c8cd"
                        }
                    }
                }
            }
        </script>
    </head>

    <body class="font-body-md text-on-background selection:bg-primary/30">
        <!-- TopAppBar -->
        <header class="fixed top-0 w-full z-50 bg-surface/60 backdrop-blur-xl border-b border-white/10">
            <div class="flex justify-between items-center h-16 px-6 max-w-[1200px] mx-auto">
                <span class="font-bold text-xl text-primary cursor-pointer" onclick="location.href='/'">
                    Lumina Review
                </span>
            </div>
        </header>

        <!-- Ambient Background Effects -->
        <main class="relative min-h-screen pt-16 flex flex-col items-center justify-center overflow-hidden">
            <div class="absolute inset-0 hero-gradient pointer-events-none"></div>

            <!-- Hero Content Section -->
            <section class="relative z-10 w-full max-w-[800px] px-6 text-center flex flex-col items-center">
                <!-- Badge -->
                <div id="status-badge" class="mb-8 px-4 py-1.5 rounded-full glass-panel flex items-center gap-2 transition-all duration-500">
                    <span class="material-symbols-outlined text-[18px] text-secondary animate-pulse">
                        auto_awesome
                    </span>
                    <span class="text-xs text-secondary uppercase tracking-widest font-mono">
                        Next-Gen  Analysis
                    </span>
                </div>

                <h1 id="main-heading"
                    class="text-3xl md:text-5xl mb-6 text-white tracking-tight font-bold leading-tight transition-all duration-500">
                    리뷰 분석의 시작,<br>
                    <span class="text-primary">
                        링크 하나로 해결하세요
                    </span>
                </h1>
                
                <!-- Central Input Field -->
                <div id="search-box-container" class="w-full max-w-[680px] transition-all duration-500">
                    <div class="relative p-2 glass-panel rounded-xl transition-all duration-300">
                        <div class="flex flex-col md:flex-row items-center gap-2">
                            <div class="flex-1 w-full relative flex items-center px-4">
                                <span class="material-symbols-outlined text-outline absolute left-4">link</span>
                                <input 
                                    id="product-url-input" required 
                                    onkeydown="javascript: if(event.keyCode == 13) startAnalysis();" 
                                    class="w-full bg-transparent border-none focus:ring-0 text-lg py-4 pl-8 placeholder:text-outline/50 text-white outline-none" 
                                    placeholder="상품 링크(URL)를 입력해 주세요" 
                                    type="text">
                            </div>
                            <button 
                                type="button" onclick="startAnalysis()" 
                                class="w-full md:w-auto px-10 py-4 bg-primary-container text-on-primary-container rounded-lg font-bold text-lg hover:bg-primary-container/80 active:scale-95 transition-all shadow-lg shadow-primary-container/20">
                                분석하기
                            </button>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-center gap-6">
                        <div class="flex items-center gap-2 text-on-surface-variant/60 text-xs">
                            <span class="material-symbols-outlined text-[16px]">
                                check_circle
                            </span> 
                            감성 분석 리포트 즉시 생성
                        </div>
                    </div>
                </div>
                
                <div id="loading-container"
                    class="hidden flex flex-col items-center justify-center p-8 transition-all duration-500 scale-95 opacity-0">
                    
                    <!-- Feature Preview Bento Grid -->
                    <div class="relative w-20 h-20 mb-6">
                        <div class="absolute inset-0 rounded-full border-4 border-primary/20"></div>
                        <div class="absolute inset-0 rounded-full border-4 border-t-secondary border-r-primary border-transparent animate-spin shadow-[0_0_15px_rgba(111,216,200,0.4)]"></div>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2 font-geist"> 
                        리뷰를 분석 중입니다...
                    </h3>
                    <p class="text-sm text-on-surface-variant max-w-[320px] leading-relaxed">
                        수천 개의 소비자 데이터를 크롤링하여 다차원 감성 분석 모델 스코어를 도출하고 있습니다. 잠시만 기다려 주세요.
                    </p>
                </div>

            </section>
        </main>

        <!-- Footer -->
        <footer class="w-full py-8 bg-[#001018] border-t border-white/5">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 px-6 max-w-container-max mx-auto">
                <div class="flex flex-col md:items-start items-center gap-2">
                    <span class="text-sm font-bold text-on-surface">Lumina Analysis</span>
                    <span class="text-xs text-on-surface-variant">© 2026 Lumina Analysis. All rights reserved.</span>
                </div>
            </div>
        </footer>

        <script>
            /* 추가 내용 */
            // SweetAlert2 공통 호출 핸들러 함수 정의
            const showLuminaAlert = (title, text, icon = "error") => {
                Swal.fire({ title: title, text: text, icon: icon, confirmButtonText: "확인" });
            };

            // 비동기 통신 로딩 UX 컨트롤 스크립트 함수
            class AppAnalysis {
                static async run(url) {
                    const response = await fetch("/api/analyze", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ product_url: url })
                    });
                    return await response.json();
                }
            }
            async function startAnalysis() {
                const urlInput = document.getElementById("product-url-input");
                const urlValue = urlInput.value.trim();
                
                if (!urlValue) {
                    /* 수정 내용 */
                    // alert("상품 링크를 입력해 주세요!");
                    showLuminaAlert("상품 링크를 입력해 주세요!", "분석을 진행할 상품 주소(URL)를 입력해 주세요.", "warning");
                    urlInput.focus();
                    /* ---- */
                    return;
                }

                // 기존 타겟 입력 UI 페이드 아웃 처리 및 숨김 연산
                const searchBox = document.getElementById("search-box-container");
                const heading = document.getElementById("main-heading");
                const badge = document.getElementById("status-badge");
                const loadingBox = document.getElementById("loading-container");

                searchBox.style.opacity = "0";
                searchBox.style.transform = "translateY(10px)";
                heading.style.opacity = "0";
                badge.style.opacity = "0";

                setTimeout(async () => {
                    searchBox.classList.add("hidden");
                    heading.classList.add("hidden");
                    badge.classList.add("hidden");

                    // 분석 애니메이션 스피너 오버레이 페이드 인 연산 활성화
                    loadingBox.classList.remove("hidden");
                    setTimeout(() => {
                        loadingBox.classList.remove("opacity-0", "scale-95");
                        loadingBox.classList.add("opacity-100", "scale-100");
                    }, 50);

                    try {
                        // 동일 포트 내 정적 서빙이므로 상대 경로로 유연하게 호출 가능
                        const response = await fetch("/api/analyze", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ product_url: urlValue })
                        });
                        const resData = await response.json();

                        if (resData.success) {
                            localStorage.setItem("analysis_result", JSON.stringify(resData.data));
                            localStorage.setItem("analysis_url", urlValue);
                            window.location.href = "/sub.html"; // 결과 화면 리다이렉트
                        } 
                        else {
                            /* 수정 내용 */
                            // alert("분석에 실패했습니다."); 
                            // window.location.reload();
                            Swal.fire({
                                title: "분석에 실패했습니다.",
                                text: "서버 연산 도중 에러가 발생했습니다. 링크를 다시 점검해 주세요.",
                                icon: "error",
                                confirmButtonText: "확인"
                            }).then((result) => {
                                // 사용자가 확인 버튼을 누른 경우에만 실행
                                if (result.isConfirmed) {
                                    window.location.reload();
                                }
                            });
                            /* ---- */
                        }
                    } 
                    catch (err) {
                        /* 수정 내용 */
                        // alert("통신 장애가 발생했습니다."); 
                        // window.location.reload();
                        Swal.fire({
                            title: "통신 장애가 발생했습니다.",
                            text: "백엔드 서버에 연결할 수 없습니다. 잠시 후 시도해 주세요.",
                            icon: "error",
                            confirmButtonText: "확인"
                        }).then((result) => {
                            if (result.isConfirmed) {
                                window.location.reload();
                            }
                        });
                        /* ----- */
                    }
                }, 400);
            }

            // 패널 마우스 트래킹 배경 광원 인터랙션 스크립트 코드
            document.addEventListener("mousemove", (e) => {
                const x = e.clientX / window.innerWidth; const y = e.clientY / window.innerHeight;
                const gradient = document.querySelector(".hero-gradient");
                if (gradient) gradient.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(26, 95, 122, 0.15) 0%, transparent 70%)`;
            });
        </script>
    </body>
</html>
