<!DOCTYPE html>
<html class="dark" lang="ko">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Lumina Review - 분석 리포트</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Geist:wght@400;600;700&amp;display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #00161f;
                color: #cae7f7;
                font-family: 'Hanken Grotesk', sans-serif;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
            }

            .glass-panel {
                background: rgba(4, 35, 46, 0.75);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                will-change: backdrop-filter;
            }

            .hero-gradient {
                background: radial-gradient(circle at center, rgba(26, 95, 122, 0.15) 0%, transparent 70%);
            }
        </style>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            "surface": "#00161f", "surface-container": "#04232e", "surface-container-high": "#102d39", "surface-container-lowest": "#001018",
                            "primary": "#92cfee", "primary-container": "#1a5f7a", "on-primary-container": "#9bd7f7", "secondary": "#6fd8c8",
                            "on-background": "#cae7f7", "on-surface-variant": "#c0c8cd", "tertiary": "#e7c268"
                        }
                    }
                }
            }
        </script>
    </head>

    <body class="p-4 md:p-8 relative min-h-screen selection:bg-primary/30">
        <div class="absolute inset-0 hero-gradient pointer-events-none z-0"></div>
        <div class="max-w-[1400px] mx-auto space-y-6 relative z-10">
            <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-white/10 pb-6">
                <div>
                    <h1 class="text-3xl font-bold text-white flex items-center gap-2">
                        <span class="text-primary cursor-pointer" onclick="location.href='/'">Lumina Review</span>
                        <span class="text-xl text-on-surface-variant/50">|</span> <span class="text-2xl font-medium">리뷰 요약 결과</span>
                    </h1>
                    <!-- <p class="text-on-surface-variant mt-2 text-sm max-w-[600px] truncate">
                        <span class="text-primary font-bold">분석 대상 링크:</span> <a id="target-link" href="#" target="_blank"
                            class="underline hover:text-white transition-colors"></a>
                    </p> -->
                </div>
                <button onclick="location.href='/'"
                    class="px-5 py-2.5 glass-panel rounded-lg text-sm text-primary hover:bg-primary-container/30 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">arrow_back</span> 새로운 링크 분석하기
                </button>
            </header>

            <main class="grid grid-cols-1 xl:grid-cols-4 gap-6">
                <!-- 반응별 속성 문장 요약 블록-->
                <section class="xl:col-span-4 glass-panel rounded-xl overflow-hidden">
                    <div class="bg-primary-container/40 px-6 py-4 border-b border-white/10">
                        <h2 class="text-white text-lg font-semibold flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">view_week</span> 속성별 속성 문장 요약
                        </h2>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 divide-y lg:divide-y-0 lg:divide-x divide-white/10">
                        <div class="p-6">
                            <h3 class="text-emerald-400 font-bold mb-4 flex items-center text-lg gap-2"><span>👍</span>긍정 (Positive)</h3>
                            <ul id="pos-container" class="space-y-3 text-on-background text-sm leading-relaxed"></ul>
                        </div>
                        <div class="p-6">
                            <h3 class="text-amber-400 font-bold mb-4 flex items-center text-lg gap-2"><span>😐</span>중립 (Neutral)</h3>
                            <ul id="neu-container" class="space-y-3 text-on-background text-sm leading-relaxed"></ul>
                        </div>
                        <div class="p-6">
                            <h3 class="text-rose-400 font-bold mb-4 flex items-center text-lg gap-2"><span>👎</span>부정 (Negative)</h3>
                            <ul id="neg-container" class="space-y-3 text-on-background text-sm leading-relaxed"></ul>
                        </div>
                    </div>
                </section>

                <!-- 최종 요약 블록 -->
                <section class="xl:col-span-2 glass-panel rounded-xl flex flex-col">
                    <div class="bg-primary-container/40 px-6 py-4 border-b border-white/10">
                        <h2 class="text-white text-lg font-semibold flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">rate_review</span> 
                            최종 요약
                        </h2>
                    </div>
                    <div class="p-6 md:p-8 flex-grow flex items-center">
                        <p id="summary-container" class="text-on-background leading-loose text-lg"></p>
                    </div>
                </section>

                <!-- 추천도 블록-->
                <section class="xl:col-span-2 glass-panel rounded-xl flex flex-col">
                    <div class="bg-primary-container/40 px-6 py-4 border-b border-white/10">
                        <h2 class="text-white text-lg font-semibold text-center">추천도</h2>
                    </div>
                    <div class="p-6 md:p-8 flex flex-col justify-center flex-grow">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                            <div class="space-y-6">
                                <div>
                                    <div class="flex justify-between items-end mb-2 font-mono">
                                        <span class="text-2sm font-bold text-on-surface-variant">리뷰 추천 비율</span>
                                        <span id="total-score-text" class="text-2lg font-bold text-secondary">0%</span>
                                    </div>
                                    <div class="w-full bg-[#001018] rounded-full h-3 overflow-hidden flex border border-white/5">
                                        <div id="total-pos-bar" class="bg-secondary h-full" style="width: 0%"></div>
                                        <div id="total-neg-bar" class="bg-rose-500/60 h-full" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <h4 class="text-xs font-bold text-on-surface-variant font-mono uppercase tracking-wider">
                                        속성별 대표 지표 구성
                                    </h4>
                                    <div id="aspect-grid" class="grid grid-cols-2 gap-x-4 gap-y-3"></div>
                                </div>
                            </div>
                            <div class="flex flex-col items-center justify-center border-t md:border-t-0 md:border-l border-white/10 pt-4 md:pt-0 md:pl-4">
                                <p class="text-2xs font-bold text-on-surface-variant/60 font-mono uppercase tracking-wider mb-2">
                                    상품 평균 평점
                                </p>
                                <div class="flex items-center justify-center gap-2 mb-1">
                                    <span class="material-symbols-outlined text-tertiary text-5xl" style="font-variation-settings: 'FILL' 1">star</span>
                                    <span id="rate-text" class="text-5xl font-bold text-white font-geist">
                                        0.0 
                                        <span class="text-2xl text-on-surface-variant/40">/ 5.0</span>
                                    </span>
                                </div>
                                <p class="text-[12px] text-on-surface-variant">실제 구매자 평점 기준</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const rawData = localStorage.getItem('analysis_result');
                // const targetUrl = localStorage.getItem('analysis_url');
                if (!rawData) { window.location.href = '/'; return; }

                const data = JSON.parse(rawData);

                // const linkAnchor = document.getElementById('target-link');
                // linkAnchor.href = targetUrl; linkAnchor.textContent = targetUrl;

                // 속성별 속성 문장 요약 리스트 동적 헬퍼 함수
                const fillList = (containerId, list, bulletColor) => {
                    const container = document.getElementById(containerId);
                    list.forEach(text => { 
                        container.innerHTML += `<li class="flex items-start"><span class="${bulletColor} mr-2 mt-0.5">•</span><span>${text}</span></li>`; 
                    });
                };
                
                fillList('pos-container', data.pos, 'text-emerald-400');
                fillList('neu-container', data.neu, 'text-amber-400');
                fillList('neg-container', data.neg, 'text-rose-400');
                
                // 최종 요약 바인딩
                document.getElementById('summary-container').textContent = data.final_summary;
                document.getElementById('rate-text').innerHTML = `${data.average_rate} <span class="text-base text-on-surface-variant/40">/ 5.0</span>`;
                
                // 추출 리뷰 긍부정 비율 연산 바인딩
                document.getElementById('total-score-text').innerHTML = `${data.total_score}% <span class="text-xs font-medium text-secondary ml-1">긍정</span>`;
                document.getElementById('total-pos-bar').style.width = `${data.total_score}%`;
                document.getElementById('total-neg-bar').style.width = `${100 - data.total_score}%`;

                // 2*2 그리드 아이템 동적 렌더링 및 조건부 색상(초록/노랑/빨강) 스크립트화
                const gridContainer = document.getElementById('aspect-grid');

                const renderAspects = (aspectScoreObj) => {
                    for (const [name, score] of Object.entries(aspectScoreObj)) {
                        let textColor, barColor;

                        // 스코어 수치에 따른 테마 색상 밸브 제어 연산
                        if (score >= 80) { 
                            textColor = 'text-emerald-400'; 
                            barColor = 'bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.5)]'; 
                        }
                        else if (score >= 50) { 
                            textColor = 'text-amber-400'; 
                            barColor = 'bg-amber-400';
                        }
                        else { 
                            textColor = 'text-rose-400'; 
                            barColor = 'bg-rose-400'; 
                        }

                        gridContainer.innerHTML += `
                            <div class="space-y-1">
                                <div class="flex justify-between text-xs">
                                    <span class="text-on-surface-variant truncate max-w-[90px]">${name}</span>
                                    <span class="font-bold ${textColor} font-mono">${score}%</span>
                                </div>
                                <div class="w-full bg-[#001018] rounded-full h-1.5 overflow-hidden">
                                    <div class="h-full ${barColor}" style="width: ${score}%"></div>
                                </div>
                            </div>
                        `;
                    }
                };

                // 대표 긍정 및 대표 부정 객체를 순서대로 격자에 드로우
                renderAspects(data.top_aspect_score);
                renderAspects(data.bottom_aspect_score);
            });
        </script>
    </body>

</html>
